# Apache reverse proxy for MyFiles.
# Needs: proxy, proxy_http, headers (and ssl for HTTPS).
#   Ubuntu: sudo a2enmod proxy proxy_http headers ssl
#   Arch:   uncomment the matching LoadModule lines in /etc/httpd/conf/httpd.conf
#
# Pick ONE of the two options below.

# ---------------------------------------------------------------------------
# Option A: its own (sub)domain, e.g. https://files.example.com/
# ---------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName files.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/files.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/files.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"

    # Apache 2.4.53+ caps request bodies at 1 GiB by default; 0 = no cap.
    # (Use MAX_UPLOAD_SIZE_MB in .env to set a limit in the app instead.)
    LimitRequestBody 0
    # Give big uploads and downloads time to finish.
    ProxyTimeout 3600
</VirtualHost>

# ---------------------------------------------------------------------------
# Option B: a sub-path of a site you already have, e.g. https://example.com/files/
# Put this inside that site's existing <VirtualHost> block.
# ---------------------------------------------------------------------------
# RedirectMatch ^/files$ /files/
# <Location /files/>
#     ProxyPass        http://127.0.0.1:8000/
#     ProxyPassReverse http://127.0.0.1:8000/
#     ProxyPassReverseCookiePath / /files/
#     RequestHeader set X-Forwarded-Proto "https"
#     LimitRequestBody 0
# </Location>
# ProxyTimeout 3600
